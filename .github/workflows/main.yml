name: "*** build ipa/tipa file ***"

on:
  push:
    branches:
      - '*'
    paths-ignore:
      - ".gitignore"
  pull_request:
    branches:
      - '*'
    paths-ignore:
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Xcode Setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@main
        with:
            repository: ${{ github.repository }}
            submodules: recursive

      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install better GNU Make
        run: |
          brew install make
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> $GITHUB_ENV

      - name: Install THEOS
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          mkdir -p $THEOS
          curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos >> install-theos.sh
          gsed -E "/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p \${THEOS}\/sdks\n\1touch \${THEOS}\/sdks\/sdk\n\1\2/g" -i install-theos.sh
          bash install-theos.sh
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz --output $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          gunzip $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          tar -xf $THEOS/sdks/iPhoneOS16.5.sdk.tar -C $THEOS/sdks
          rm $THEOS/sdks/iPhoneOS16.5.sdk.tar
          cd $BASEDIR

      - name: Build and Install trustcache
        run: |
          set -x
          git clone https://github.com/CRKatri/trustcache
          cd trustcache
          export CFLAGS="$CFLAGS -I$(brew --prefix openssl)/include -arch arm64"
          export LDFLAGS="$LDFLAGS -L$(brew --prefix openssl)/lib -arch arm64"
          gmake -j$(sysctl -n hw.logicalcpu) OPENSSL=1
          sudo cp trustcache /opt/procursus/bin/

      - name: Set Environment Variables
        run: |
          set -x
          T2=$(TZ=UTC-2 date +'%Y%m%d_%H%M%S')
          TS=$(date -j -f "%Y%m%d_%H%M%S" "${T2}" +%s)
          SHASH=$(git rev-parse --short HEAD)
          echo "ctime=${T2}" >> $GITHUB_ENV
          echo "ctimestamp=${TS}" >> $GITHUB_ENV
          echo "shorthash=${SHASH}" >> $GITHUB_ENV

      - name: Install libarchive
        run: |
          brew install libarchive

      - name: Pin zstd to upstream-resolved revision
        run: |
          set -x
          mkdir -p Application/Dopamine.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          printf '%s\n' \
            '{' \
            '  "pins" : [' \
            '    {' \
            '      "identity" : "zstd",' \
            '      "kind" : "remoteSourceControl",' \
            '      "location" : "https://github.com/facebook/zstd.git",' \
            '      "state" : {' \
            '        "branch" : "dev",' \
            '        "revision" : "49bf1d14c8ffc6a25c32667ce878c4148f43ac4f"' \
            '      }' \
            '    }' \
            '  ],' \
            '  "version" : 3' \
            '}' > Application/Dopamine.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Build
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          export COMMIT_HASH_OVERRIDE="9617d75f476423fdfd33477299c8a1349eb6f375"
          gmake -j$(sysctl -n hw.logicalcpu) NIGHTLY=1 COMMIT_HASH="${COMMIT_HASH_OVERRIDE}"
          APP_VERSION="$(cat ./BaseBin/_external/basebin/.version)-$(cat ./BaseBin/_external/basebin/.version-roothide)"
          VERSION="(${APP_VERSION}-9617d75)-2026.11.06-UTC-02.17.10"
          mv "./Application/FFKRW-roothide-${APP_VERSION}.ipa"  "./Application/roothide-FFKRW-${VERSION}.ipa"
          mv "./Application/FFKRW-roothide-${APP_VERSION}.tipa" "./Application/roothide-FFKRW-${VERSION}.tipa"
          echo "version=${VERSION}" >> $GITHUB_ENV

      - name: Upload Artifact
        id: dopamine-latest-upload
        uses: actions/upload-artifact@main
        with:
          name: FFKRW
          path: |
            ${{ github.workspace }}/Application/roothide-FFKRW-${{ env.version }}.ipa
          archive: false

      - name: Upload Artifact(TIPA)
        id: dopamine-latest-upload-tipa
        uses: actions/upload-artifact@main
        with:
          path: |
            ${{ github.workspace }}/Application/roothide-FFKRW-${{ env.version }}.tipa
          archive: false